kind = "mobile"
previewPath = "/panel-apk/"
title = "Nexus Panel APK"
version = "1.0.0"
id = "artifacts/panel-apk"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/panel-apk/" ]
localPort = 21716

[services.development]
run = "pnpm --filter @workspace/panel-apk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/panel-apk", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/panel-apk", "run", "serve" ]

[services.env]
PORT = "21716"
BASE_PATH = "/panel-apk/"
